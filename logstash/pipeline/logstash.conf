input {
  file {
    path => "/logs/auth.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
  }
}

filter {
  grok {
    match => { "message" => [
      "%{SYSLOGTIMESTAMP:log_time} %{HOSTNAME:server} sshd\[%{POSINT:pid}\]: Failed password for (invalid user )?%{USERNAME:[user][name]} from %{IP:src_ip} port %{INT:src_port} ssh2",
      "%{SYSLOGTIMESTAMP:log_time} %{HOSTNAME:server} sshd\[%{POSINT:pid}\]: Accepted password for %{USERNAME:[user][name]} from %{IP:src_ip} port %{INT:src_port} ssh2"
    ] }
  }
  date {
    match => ["log_time", "MMM dd HH:mm:ss", "MMM  d HH:mm:ss"]
    timezone => "Asia/Karachi"
    target => "@timestamp"
  }
  if "Failed password" in [message] {
    mutate { add_field => {
      "outcome" => "failure"
      "[event][outcome]" => "failure"
      "[event][action]" => "ssh_login_failed"
    } }
  } else if "Accepted password" in [message] {
    mutate { add_field => {
      "outcome" => "success"
      "[event][outcome]" => "success"
      "[event][action]" => "ssh_login_success"
    } }
  }
  mutate {
    add_field => {
      "[event][category]" => "authentication"
      "[event][dataset]" => "sshd.auth"
      "[process][name]" => "sshd"
    }
    copy => {
      "src_ip" => "[source][ip]"
      "src_port" => "[source][port]"
      "pid" => "[process][pid]"
      "server" => "[host][name]"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    index => "ssh-auth-%{+YYYY.MM.dd}"
  }
}

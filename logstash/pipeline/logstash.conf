input {
  file {
    path => "/logs/auth.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
  }
}

filter {
  grok {
    match => { "message" => [
      "%{SYSLOGTIMESTAMP:log_time} %{HOSTNAME:server} sshd\[%{POSINT:pid}\]: Failed password for (invalid user )?%{USERNAME:user} from %{IP:src_ip} port %{INT:src_port} ssh2",
      "%{SYSLOGTIMESTAMP:log_time} %{HOSTNAME:server} sshd\[%{POSINT:pid}\]: Accepted password for %{USERNAME:user} from %{IP:src_ip} port %{INT:src_port} ssh2"
    ] }
  }
  date {
    match => ["log_time", "MMM dd HH:mm:ss", "MMM  d HH:mm:ss"]
    timezone => "Asia/Karachi"
    target => "@timestamp"
  }
  if "Failed password" in [message] {
    mutate { add_field => { "outcome" => "failure" } }
  } else if "Accepted password" in [message] {
    mutate { add_field => { "outcome" => "success" } }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "ssh-auth-%{+YYYY.MM.dd}"
  }
}
